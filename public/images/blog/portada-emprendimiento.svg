<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Bombillo con una planta que brota y barras de crecimiento" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="800" height="600" fill="#ffe971"/>
  <!-- puntos de fondo -->
  <g fill="#0b090b" opacity=".12">
    <circle cx="60" cy="60" r="5"/><circle cx="140" cy="60" r="5"/><circle cx="220" cy="60" r="5"/><circle cx="300" cy="60" r="5"/><circle cx="380" cy="60" r="5"/><circle cx="460" cy="60" r="5"/><circle cx="540" cy="60" r="5"/><circle cx="620" cy="60" r="5"/><circle cx="700" cy="60" r="5"/>
    <circle cx="60" cy="540" r="5"/><circle cx="140" cy="540" r="5"/><circle cx="220" cy="540" r="5"/><circle cx="300" cy="540" r="5"/><circle cx="380" cy="540" r="5"/><circle cx="460" cy="540" r="5"/><circle cx="540" cy="540" r="5"/><circle cx="620" cy="540" r="5"/><circle cx="700" cy="540" r="5"/>
  </g>

  <!-- rayos -->
  <g stroke="#0b090b" stroke-width="8" stroke-linecap="round">
    <line x1="300" y1="70" x2="300" y2="40"/>
    <line x1="195" y1="115" x2="172" y2="92"/>
    <line x1="405" y1="115" x2="428" y2="92"/>
    <line x1="150" y1="215" x2="118" y2="215"/>
    <line x1="450" y1="215" x2="482" y2="215"/>
  </g>

  <!-- barras de crecimiento (sombra dura + barra) -->
  <g fill="#0b090b">
    <rect x="534" y="404" width="64" height="96"/>
    <rect x="610" y="344" width="64" height="156"/>
    <rect x="686" y="274" width="64" height="226"/>
  </g>
  <g stroke="#0b090b" stroke-width="6" stroke-linejoin="round">
    <rect x="526" y="396" width="64" height="96" fill="#fc7da8"/>
    <rect x="602" y="336" width="64" height="156" fill="#7d9e4a"/>
    <rect x="678" y="266" width="64" height="226" fill="#af75c0"/>
  </g>
  <line x1="500" y1="492" x2="770" y2="492" stroke="#0b090b" stroke-width="6" stroke-linecap="round"/>

  <!-- flecha ascendente -->
  <path d="M520 360 L610 290 L650 320 L740 220" fill="none" stroke="#0b090b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M705 214 L744 216 L740 256" fill="none" stroke="#0b090b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- bombillo: sombra dura -->
  <circle cx="306" cy="246" r="110" fill="#0b090b"/>
  <rect x="256" y="352" width="100" height="62" rx="12" fill="#0b090b"/>
  <!-- bombillo -->
  <circle cx="300" cy="240" r="110" fill="#fdf7f5" stroke="#0b090b" stroke-width="6"/>
  <rect x="250" y="346" width="100" height="62" rx="12" fill="#8c529b" stroke="#0b090b" stroke-width="6"/>
  <line x1="258" y1="368" x2="342" y2="368" stroke="#0b090b" stroke-width="5" stroke-linecap="round"/>
  <line x1="258" y1="388" x2="342" y2="388" stroke="#0b090b" stroke-width="5" stroke-linecap="round"/>

  <!-- brote dentro del bombillo -->
  <path d="M300 340 L300 250" fill="none" stroke="#0b090b" stroke-width="7" stroke-linecap="round"/>
  <path d="M300 280 C 250 285 232 250 238 222 C 276 220 298 244 300 280 Z" fill="#7d9e4a" stroke="#0b090b" stroke-width="6" stroke-linejoin="round"/>
  <path d="M300 262 C 350 266 372 232 364 202 C 324 200 302 226 300 262 Z" fill="#97b566" stroke="#0b090b" stroke-width="6" stroke-linejoin="round"/>

  <!-- estrellas -->
  <g fill="#fc7da8" stroke="#0b090b" stroke-width="5" stroke-linejoin="round">
    <path d="M110 420 L121 449 L150 460 L121 471 L110 500 L99 471 L70 460 L99 449 Z"/>
    <path d="M470 100 L477 118 L495 125 L477 132 L470 150 L463 132 L445 125 L463 118 Z"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
