<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Gráfica del punto de equilibrio: las rectas de ingresos y costos totales se cruzan; a la izquierda hay pérdida y a la derecha utilidad" xmlns:c2pa="http://c2pa.org/manifest">
  <rect width="640" height="400" fill="#fdf7f5"/>
  <!-- zonas -->
  <polygon points="70,250 390,163.85 70,330" fill="#fc7da8" opacity=".35"/>
  <polygon points="390,163.85 590,110 590,60" fill="#97b566" opacity=".45"/>
  <!-- ejes -->
  <g stroke="#0b090b" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M70 40 V330 H610"/>
  </g>
  <!-- costos fijos -->
  <line x1="70" y1="250" x2="590" y2="250" stroke="#0b090b" stroke-width="4" stroke-dasharray="10 8"/>
  <!-- costos totales -->
  <line x1="70" y1="250" x2="590" y2="110" stroke="#8c529b" stroke-width="6" stroke-linecap="round"/>
  <!-- ingresos -->
  <line x1="70" y1="330" x2="590" y2="60" stroke="#5e7a36" stroke-width="6" stroke-linecap="round"/>
  <!-- guías del punto de equilibrio -->
  <line x1="390" y1="163.85" x2="390" y2="330" stroke="#0b090b" stroke-width="3" stroke-dasharray="4 6"/>
  <line x1="70" y1="163.85" x2="390" y2="163.85" stroke="#0b090b" stroke-width="3" stroke-dasharray="4 6"/>
  <circle cx="390" cy="163.85" r="11" fill="#ffe971" stroke="#0b090b" stroke-width="4"/>
  <!-- textos -->
  <g font-family="Rethink Sans, Arial, sans-serif" fill="#0b090b" font-size="17">
    <text x="395" y="352" font-weight="700">Punto de equilibrio</text>
    <text x="330" y="146" text-anchor="end" font-weight="700" font-size="15">Ingresos = costos</text>
    <text x="596" y="56" text-anchor="end" font-weight="700">Ingresos</text>
    <text x="596" y="130" text-anchor="end" font-weight="700">Costos totales (CF + CV)</text>
    <text x="80" y="242" font-weight="700">Costos fijos (CF)</text>
    <text x="84" y="288" font-weight="700" font-size="15">Pérdida</text>
    <text x="515" y="118" font-weight="700" font-size="14">Utilidad</text>
    <text x="340" y="384" text-anchor="middle">Unidades producidas y vendidas</text>
    <text x="24" y="190" transform="rotate(-90 24 190)" text-anchor="middle">Dinero ($)</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
